name: HDD external-folder test IPA
run-name: HDD external-folder test IPA • ${{ github.sha }}

on:
  push:
    branches:
      - Claude
    paths:
      - .github/workflows/hdd-external-folder-test-ipa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rewindbox-hdd-external-folder-test-ipa
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iPhone test IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # RewindBox's pinned JIT build verifies an older project baseline.
          fetch-depth: 0
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Validate external-folder linking
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos
          flutter test test/melonx_transfer_test.dart

      # MeloNX's engine and its native support frameworks are source-built in
      # dedicated upstream jobs.  This test lane uses those exact, pinned
      # public artifacts instead of substituting a different emulator build.
      - name: Download the pinned MeloNX engine
        uses: actions/download-artifact@v4
        with:
          repository: TarbleFR/RewindBox
          name: MeloNX-engine-ab6d87ebb8b33d0151953b1b9ea7cefaab7a4b12
          run-id: 40152134234
          github-token: ${{ github.token }}
          path: dist/melonx

      - name: Download the pinned MeloNX native support
        uses: actions/download-artifact@v4
        with:
          repository: TarbleFR/RewindBox
          name: MeloNX-native-dependencies-66737aa9c959eb5915264bf178f179bda8643314
          run-id: 39854858591
          github-token: ${{ github.token }}
          path: dist/melonx-native

      - name: Materialize the verified MeloNX runtime, controls and memory donor
        run: |
          set -euo pipefail
          python3 build-utils/melonx/package_runtime.py
          git init .native-sources/MeloNX
          git -C .native-sources/MeloNX remote add origin https://starforgejo.dev/projects/MeloNX.git
          git -C .native-sources/MeloNX fetch --depth 1 origin 13700519f3abc4e6d7ed8a065b118b2cc59bcd67
          git -C .native-sources/MeloNX checkout --detach FETCH_HEAD
          git init .native-sources/Melo-Controller
          git -C .native-sources/Melo-Controller remote add origin https://github.com/stossy11/Melo-Controller.git
          git -C .native-sources/Melo-Controller fetch --depth 1 origin c049ce88a5635bddcd88e1965c42aa8fc92fe961
          git -C .native-sources/Melo-Controller checkout --detach FETCH_HEAD
          python3 build-utils/melonx/vendor_controller.py .native-sources/Melo-Controller .native-sources/MeloNX

      - name: Generate the iPhone app shell
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          rm -rf ios
          python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold
          python3 build-utils/configure_neoswap_storage.py
          python3 build-utils/configure_neoplay_ios.py --deployment-only

      - name: Set up iPhone project tools
        run: |
          set -euo pipefail
          bundle config set --local path build/ruby-gems
          bundle install --gemfile build-utils/Gemfile.dolphin

      - name: Generate the storage relay
        run: |
          set -euo pipefail
          python3 build-utils/configure_neoswap_donor.py
          python3 build-utils/configure_neoswap_relay.py

      - name: Build the required JIT support framework
        run: |
          set -euo pipefail
          command -v xcodegen || brew install xcodegen
          python3 build-utils/build_patched_stikjit.py

      - name: Build the pinned Dolphin framework
        env:
          BUILD_NUMBER: '1'
          DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
          SRC="$RUNNER_TEMP/dolphin-ios"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/OatmealDome/dolphin-ios.git
          git -C "$SRC" fetch --depth 1 origin "$DOLPHIN_SHA"
          git -C "$SRC" checkout --detach FETCH_HEAD
          git -C "$SRC" submodule update --init --recursive --depth 1
          test "$(git -C "$SRC" rev-parse HEAD)" = "$DOLPHIN_SHA"
          python3 build-utils/patch_dolphin_internal_core_v2.py "$SRC"
          cmake -S "$SRC" -B "$SRC/build-iphoneos-Release" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SRC/Externals/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=17.4 -DENABLE_VISIBILITY=ON \
            -DENABLE_BITCODE=OFF -DENABLE_ARC=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-fPIC -DIOS=ON -DENABLE_ANALYTICS=NO \
            -DUSE_SYSTEM_LIBS=OFF -DENABLE_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$SRC/build-iphoneos-Release" --target dolphin --parallel 3
          python3 packages/dolphin_internal_bridge/ci/build_support.py framework "$SRC"

      - name: Configure the native iPhone hosts
        run: |
          set -euo pipefail
          python3 build-utils/configure_dolphin_ios_v2.py
          python3 build-utils/configure_melonx_ios.py
          pod install --project-directory=ios

      - name: Build iPhone app without a release signature
        run: |
          set -euo pipefail
          flutter --verbose build ios --release --no-codesign

      - name: Package sideloadable test IPA
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          mkdir -p dist/Payload
          ditto "$APP" dist/Payload/RewindBox.app
          ditto -c -k --sequesterRsrc --keepParent dist/Payload \
            dist/RewindBox-HDD-External-Folder-Test.ipa
          shasum -a 256 dist/RewindBox-HDD-External-Folder-Test.ipa \
            > dist/RewindBox-HDD-External-Folder-Test.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RewindBox-HDD-External-Folder-Test-${{ github.sha }}
          path: |
            dist/RewindBox-HDD-External-Folder-Test.ipa
            dist/RewindBox-HDD-External-Folder-Test.ipa.sha256
          if-no-files-found: error
          retention-days: 7
